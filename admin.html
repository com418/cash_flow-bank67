<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin - SVG</title><script type="importmap">{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"}}</script><style>body{margin:0;background:#070710;color:white;font-family:sans-serif}.sidebar{width:240px;background:#0e0e1a;border-right:1px solid #222;padding:20px;min-height:100vh;position:fixed}.main{margin-left:240px;padding:30px} th{color:#666;font-size:12px;text-align:left;padding:12px;border-bottom:1px solid #222} td{padding:14px;border-bottom:1px solid #1a1a2a;font-size:14px}.btn{padding:7px 12px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:700;margin:3px;display:inline-flex;align-items:center;gap:4px} @media(max-width:900px){.sidebar{position:relative;width:100%;min-height:auto}.main{margin-left:0}}</style></head><body>
<div class="sidebar">
  <div style="display:flex; gap:10px; align-items:center;"><svg width="32" height="32" viewBox="0 0 24 24" fill="#4ade80"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5z"/></svg><h2 style="color:#4ade80; margin:0;">Cash-Flow</h2></div>
  <small style="color:#666;">SVG Admin</small>
</div>
<div class="main"><h1 style="display:flex; gap:10px; align-items:center;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/></svg> Admin Dashboard</h1><div id="list" style="background:#151522; border-radius:16px; padding:20px; margin-top:20px;">Loading...</div></div>
<script type="module">
import { initializeApp } from "firebase/app"; import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc } from "firebase/firestore";
const firebaseConfig = { apiKey: "AIzaSyAV9KRb7IfBciOEVOC1kyyNEbVUjGwEM8Y", authDomain: "cash-flow-banking662.firebaseapp.com", projectId: "cash-flow-banking662", storageBucket: "cash-flow-banking662.firebasestorage.app", messagingSenderId: "1070548352535", appId: "1:1070548352535:web:c9afa3160df0df8d52a652" };
const app=initializeApp(firebaseConfig); const db=getFirestore(app);
async function load(){
  const snap=await getDocs(collection(db,"users"));
  let html=`<table><tr><th>USER & ACCT</th><th>DATE</th><th>BAL</th><th>ACTIONS</th></tr>`;
  snap.forEach(d=>{
    const u=d.data(); const id=d.id;
    html+=`<tr><td><div style="display:flex; gap:10px; align-items:center;"><img src="${u.profilePic||'https://via.placeholder.com/60'}" style="width:42px; height:42px; border-radius:50%;"><div><b>${u.email}</b><br><code style="color:#4ade80;">${u.accountNumber||'----'}</code><br><small style="color:${u.status==='approved'?'#4ade80':'orange'}">${u.isFrozen?'FROZEN':u.status.toUpperCase()}</small></div></div></td>
    <td><input type="date" value="${u.customCreatedDate||''}" onchange="changeDate('${id}',this.value)" style="background:#0e0e1a; border:1px solid #333; color:white; padding:5px; border-radius:8px;"></td>
    <td>$${u.balance}</td>
    <td>
      <button class="btn" style="background:#4ade80;" onclick="approve('${id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg> Approve</button>
      <button class="btn" style="background:#fb923c;" onclick="decline('${id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Decline</button>
      <button class="btn" style="background:#38bdf8;" onclick="freeze('${id}',${u.isFrozen})"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> ${u.isFrozen?'Unfreeze':'Freeze'}</button>
      <button class="btn" style="background:white;" onclick="fund('${id}',${u.balance})"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Fund</button>
      <button class="btn" style="background:#ef4444; color:white;" onclick="del('${id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> Delete</button>
    </td></tr>`;
  });
  html+=`</table>`; document.getElementById('list').innerHTML=html;
}
window.changeDate=async(id,date)=>{ await updateDoc(doc(db,"users",id),{customCreatedDate:date}); load(); }
window.approve=async(id)=>{ await updateDoc(doc(db,"users",id),{status:"approved"}); load(); }
window.decline=async(id)=>{ await updateDoc(doc(db,"users",id),{status:"declined"}); load(); }
window.freeze=async(id,f)=>{ await updateDoc(doc(db,"users",id),{isFrozen:!f}); load(); }
window.fund=async(id,bal)=>{ const a=prompt("Amount:", "1000"); if(!a) return; await updateDoc(doc(db,"users",id),{balance:bal+parseInt(a)}); load(); }
window.del=async(id)=>{ if(confirm("Delete?")){ await deleteDoc(doc(db,"users",id)); load(); } }
load();
</script></body></html>
