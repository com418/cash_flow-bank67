<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cash-Flow Banking</title>
<script type="importmap">{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/auth":"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"}}</script>
<style>
*{font-family:Inter,sans-serif; box-sizing:border-box; margin:0; padding:0}
body{background:#070710; color:white; overflow-x:hidden;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-25px)}}
.hero{max-width:1250px; margin:0 auto; padding:30px 20px 100px; display:flex; flex-wrap:wrap; gap:50px; position:relative; z-index:2;}
.card{background:rgba(21,21,34,0.92); backdrop-filter:blur(20px); border:1px solid #2a2a3a; border-radius:24px; padding:26px; width:100%; max-width:440px;}
input{width:100%; padding:14px; border-radius:12px; border:1px solid #2a2a3a; background:#0e0e1a; color:white; margin:7px 0;}
.btn{width:100%; padding:14px; border-radius:12px; border:none; font-weight:800; cursor:pointer; margin-top:10px; display:flex; align-items:center; justify-content:center; gap:8px;}
.btn-green{background:#4ade80; color:black;}.btn-outline{background:transparent; border:1px solid #4ade80; color:#4ade80;}
.float-card{position:absolute; background:rgba(255,255,255,0.07); backdrop-filter:blur(15px); border:1px solid rgba(255,255,255,0.12); border-radius:16px; padding:14px 18px; display:flex; align-items:center; gap:12px; animation:float 5s ease-in-out infinite; z-index:3;}
.fab{position:fixed; bottom:25px; right:25px; width:60px; height:60px; background:#4ade80; border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 10px 40px rgba(74,222,128,0.5); z-index:99; animation:float 3s infinite; cursor:pointer;}
.acct-box{background:#0e0e1a; border:1px dashed #4ade80; padding:12px; border-radius:12px; text-align:center; margin:12px 0; display:none;}
@media(max-width:900px){.float-card{display:none}}
</style>
</head>
<body>

<!-- SVG BLOBS BACKGROUND -->
<svg style="position:absolute; top:0; left:0; width:100%; height:100%; z-index:0; opacity:0.25;" xmlns="http://www.w3.org/2000/svg">
  <defs><filter id="blur"><feGaussianBlur stdDeviation="60"/></filter></defs>
  <circle cx="10%" cy="10%" r="180" fill="#4ade80" filter="url(#blur)"><animate attributeName="cy" values="10%;15%;10%" dur="6s" repeatCount="indefinite"/></circle>
  <circle cx="90%" cy="25%" r="140" fill="#8b5cf6" filter="url(#blur)"><animate attributeName="cy" values="25%;30%;25%" dur="7s" repeatCount="indefinite"/></circle>
  <circle cx="50%" cy="90%" r="220" fill="#38bdf8" filter="url(#blur)"><animate attributeName="cy" values="90%;85%;90%" dur="8s" repeatCount="indefinite"/></circle>
</svg>

<!-- FLOATING SVG CARDS -->
<div class="float-card" style="top:15%; left:3%;">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
  <div><small style="color:#888;">Balance</small><br><b>$5,240</b></div>
</div>
<div class="float-card" style="top:55%; left:0%; animation-delay:1.5s;">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
  <div><small style="color:#888;">Growth</small><br><b style="color:#4ade80;">+12.5%</b></div>
</div>
<div class="float-card" style="bottom:15%; right:5%; animation-delay:2.5s;">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
  <div><small>Secured</small><br><b>256-bit</b></div>
</div>
<div class="float-card" style="top:10%; right:8%;">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fb923c" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
  <div><small>Transfer</small><br><b>Instant</b></div>
</div>

<div class="fab"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div>

<div class="hero">
  <div style="flex:1; min-width:300px;">
    <div style="display:flex; align-items:center; gap:8px; background:#151522; border:1px solid #333; padding:6px 14px; border-radius:20px; width:fit-content;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="#4ade80"><circle cx="12" cy="12" r="10"/></svg>
      <span style="font-size:12px; color:#4ade80;">CASH-FLOW BANKING • DEMO</span>
    </div>
    <h1 style="font-size:60px; font-weight:900; line-height:0.95; margin-top:20px;">Banking That<br><span style="color:#4ade80;">Flows</span><br>With You</h1>
    <p style="color:#8a8a9a; margin-top:20px; max-width:400px; font-size:18px;">Generate 10-digit account number, upload picture, pick custom date, login with account number + password.</p>
  </div>

  <div class="card">
    <div style="text-align:center;">
      <svg width="80" height="80" viewBox="0 0 100 100" style="margin:0 auto 10px;"><circle cx="50" cy="50" r="48" fill="none" stroke="#4ade80" stroke-width="2"/><circle id="previewSvg" cx="50" cy="50" r="35" fill="#222" style="display:none;"/><text x="50" y="55" text-anchor="middle" fill="#666" font-size="12">PIC</text></svg>
      <img id="preview" style="width:80px; height:80px; border-radius:50%; object-fit:cover; border:2px solid #4ade80; display:none; margin:0 auto 10px;">
      <h3>Open Free Account</h3>
    </div>
    <div id="acctDisplay" class="acct-box"><small style="color:#888;">YOUR 10-DIGIT ACCOUNT NUMBER</small><h2 id="acctNum" style="color:#4ade80; letter-spacing:3px; font-family:monospace; font-size:26px;"></h2></div>
    <label style="font-size:11px; color:#888;">Profile Picture</label><input id="pic" type="file" accept="image/*">
    <label style="font-size:11px; color:#888;">Email</label><input id="email" placeholder="you@cashflow.com">
    <label style="font-size:11px; color:#888;">Account Number or Email (login)</label><input id="loginId" placeholder="30xxxxxxxx or email">
    <label style="font-size:11px; color:#888;">Password</label><input id="password" type="password" placeholder="••••••••">
    <label style="font-size:11px; color:#888;">Opening Date</label><input id="customDate" type="date">
    <button onclick="signup()" id="btn" class="btn btn-green">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Create + Generate Acct No
    </button>
    <button onclick="login()" class="btn btn-outline">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> Login
    </button>
    <p id="msg" style="margin-top:12px; text-align:center; font-size:13px; color:#4ade80;"></p>
    <a href="admin.html" style="display:flex; justify-content:center; gap:6px; color:#666; font-size:12px; text-decoration:none; margin-top:12px; align-items:center;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg> Admin Panel
    </a>
  </div>
</div>

<script type="module">
import { initializeApp } from "firebase/app"; import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "firebase/auth"; import { getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs } from "firebase/firestore";
const firebaseConfig = { apiKey: "AIzaSyAV9KRb7IfBciOEVOC1kyyNEbVUjGwEM8Y", authDomain: "cash-flow-banking662.firebaseapp.com", projectId: "cash-flow-banking662", storageBucket: "cash-flow-banking662.firebasestorage.app", messagingSenderId: "1070548352535", appId: "1:1070548352535:web:c9afa3160df0df8d52a652" };
const app=initializeApp(firebaseConfig); const auth=getAuth(app); const db=getFirestore(app);
let base64Pic="";
document.getElementById('pic').addEventListener('change', e=>{ const file=e.target.files[0]; if(!file) return; const r=new FileReader(); r.onload=ev=>{ const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); const max=200; let w=img.width,h=img.height; if(w>h){ if(w>max){ h*=max/w; w=max; }} else { if(h>max){ w*=max/h; h=max; }} c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); base64Pic=c.toDataURL('image/jpeg',0.7); document.getElementById('preview').src=base64Pic; document.getElementById('preview').style.display='block'; }; img.src=ev.target.result; }; r.readAsDataURL(file); });
document.getElementById('customDate').valueAsDate=new Date();
function genAcct(){ return '30'+Math.floor(10000000+Math.random()*90000000).toString(); }
window.signup=async()=>{ const email=document.getElementById('email').value.trim(); const pass=document.getElementById('password').value; const date=document.getElementById('customDate').value; if(!email||!pass||!date) return alert("Fill all fields"); document.getElementById('btn').innerText="Generating..."; try{ const acct=genAcct(); const cred=await createUserWithEmailAndPassword(auth,email,pass); await setDoc(doc(db,"users",cred.user.uid),{email,accountNumber:acct,balance:0,status:"pending",isFrozen:false,profilePic:base64Pic,customCreatedDate:date,realCreatedAt:new Date().toISOString()}); document.getElementById('acctDisplay').style.display='block'; document.getElementById('acctNum').innerText=acct; document.getElementById('msg').innerText="Account "+acct+" created on "+date; await signOut(auth);}catch(e){ alert(e.message);} document.getElementById('btn').innerText="Create + Generate Acct No"; }
window.login=async()=>{ const input=document.getElementById('loginId').value.trim()||document.getElementById('email').value.trim(); const pass=document.getElementById('password').value; if(!input||!pass) return alert("Enter Acct No/Email + Password"); try{ let emailLogin=input; if(/^\d{10}$/.test(input)){ const q=query(collection(db,"users"), where("accountNumber","==",input)); const snap=await getDocs(q); if(snap.empty) return alert("Account number not found"); emailLogin=snap.docs[0].data().email; } const cred=await signInWithEmailAndPassword(auth,emailLogin,pass); const snap=await getDoc(doc(db,"users",cred.user.uid)); const u=snap.data(); if(u.status!=="approved"){ document.getElementById('msg').innerText="Status: "+u.status; await signOut(auth); return;} if(u.isFrozen){ document.getElementById('msg').innerText="Frozen"; await signOut(auth); return;} document.getElementById('acctDisplay').style.display='block'; document.getElementById('acctNum').innerText=u.accountNumber; document.getElementById('msg').innerText=`Welcome! ${u.accountNumber} | $${u.balance}`; }catch(e){ alert(e.message);} }
</script>
</body>
</html>
