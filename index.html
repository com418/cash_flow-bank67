<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cashflowbank - Secure Online Banking</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <!-- AUTH SECTION -->
    <div id="auth-section" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white max-w-md w-full rounded-2xl shadow-xl p-8 border border-slate-100">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 text-white rounded-2xl text-2xl font-bold shadow-lg shadow-blue-200 mb-3">
                    <i class="fa-solid fa-vault"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900">Cashflowbank</h1>
                <p class="text-sm text-slate-500">Your trusted partner in financial growth</p>
            </div>

            <!-- Tabs -->
            <div class="flex border-b border-slate-200 mb-6">
                <button onclick="switchTab('login')" id="tab-login" class="flex-1 pb-3 text-sm font-semibold text-blue-600 border-b-2 border-blue-600 transition">Sign In</button>
                <button onclick="switchTab('register')" id="tab-register" class="flex-1 pb-3 text-sm font-semibold text-slate-400 border-b-2 border-transparent transition">Register</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Email Address</label>
                    <input type="email" id="login-email" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Password</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-semibold text-sm shadow-lg shadow-blue-200 transition">Access Account</button>
            </form>

            <!-- Register Form -->
            <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Full Name</label>
                    <input type="text" id="reg-name" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Email Address</label>
                    <input type="email" id="reg-email" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Password</label>
                    <input type="password" id="reg-password" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-semibold text-sm shadow-lg shadow-blue-200 transition">Create Account</button>
            </form>
            <p id="auth-error" class="text-red-500 text-xs mt-4 text-center hidden"></p>
        </div>
    </div>

    <!-- DASHBOARD SECTION (Hidden by default) -->
    <div id="dashboard-section" class="hidden min-h-screen flex flex-col">
        <!-- Top Navbar -->
        <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-blue-600 text-white rounded-xl flex items-center justify-center font-bold text-lg">
                    <i class="fa-solid fa-vault"></i>
                </div>
                <span class="font-bold text-lg text-slate-900">Cashflowbank</span>
            </div>
            <div class="flex items-center space-x-4">
                <span id="user-display-name" class="text-sm font-medium text-slate-600">Welcome</span>
                <button onclick="handleLogout()" class="text-red-600 hover:bg-red-50 p-2 rounded-lg text-sm font-semibold transition">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> Logout
                </button>
            </div>
        </header>

        <!-- Main Content Grid -->
        <main class="flex-1 max-w-6xl w-full mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Account Overview Cards -->
            <div class="md:col-span-2 space-y-6">
                <!-- Balance Card -->
                <div class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white p-6 rounded-2xl shadow-lg relative overflow-hidden">
                    <div class="absolute right-[-20px] bottom-[-20px] text-white/10 text-9xl">
                        <i class="fa-solid fa-wallet"></i>
                    </div>
                    <p class="text-xs uppercase tracking-wider text-blue-200 font-semibold mb-1">Available Balance</p>
                    <h2 class="text-4xl font-extrabold mb-4" id="account-balance">$24,580.50</h2>
                    <div class="flex space-x-3">
                        <button onclick="openTransferModal()" class="bg-white text-blue-700 px-4 py-2 rounded-xl text-xs font-bold shadow hover:bg-blue-50 transition">
                            <i class="fa-solid fa-arrow-up-right-from-square mr-1"></i> Send Money
                        </button>
                        <button onclick="alert('Deposit gateway initialized.')" class="bg-blue-500/30 text-white border border-white/20 px-4 py-2 rounded-xl text-xs font-bold backdrop-blur hover:bg-blue-500/50 transition">
                            <i class="fa-solid fa-plus mr-1"></i> Add Funds
                        </button>
                    </div>
                </div>

                <!-- Recent Transactions -->
                <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
                    <h3 class="font-bold text-slate-900 mb-4 text-base">Recent Transactions</h3>
                    <div class="space-y-4" id="transaction-list">
                        <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center font-bold">
                                    <i class="fa-solid fa-arrow-down"></i>
                                </div>
                                <div>
                                    <h4 class="text-sm font-bold text-slate-900">Direct Deposit - Salary</h4>
                                    <p class="text-xs text-slate-400">Oct 24, 2026</p>
                                </div>
                            </div>
                            <span class="text-emerald-600 font-bold text-sm">+$3,200.00</span>
                        </div>
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 bg-rose-50 text-rose-600 rounded-xl flex items-center justify-center font-bold">
                                    <i class="fa-solid fa-arrow-up"></i>
                                </div>
                                <div>
                                    <h4 class="text-sm font-bold text-slate-900">Grocery Store</h4>
                                    <p class="text-xs text-slate-400">Oct 22, 2026</p>
                                </div>
                            </div>
                            <span class="text-rose-600 font-bold text-sm">-$145.20</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Quick Transfer Widget Sidebar -->
            <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm h-fit">
                <h3 class="font-bold text-slate-900 mb-4 text-base">Quick Transfer</h3>
                <form onsubmit="handleTransfer(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Recipient Account / Email</label>
                        <input type="text" id="transfer-recipient" placeholder="name@email.com" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Amount ($)</label>
                        <input type="number" id="transfer-amount" placeholder="0.00" min="1" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white py-2.5 rounded-xl text-xs font-bold transition">
                        Transfer Now
                    </button>
                </form>
            </div>
        </main>
    </div>

    <!-- Firebase SDK Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Your Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCBR4EQx9UXqGFgHKKKcH_11VWhumpQ4KA",
            authDomain: "cashflowbank-e7144.firebaseapp.com",
            projectId: "cashflowbank-e7144",
            storageBucket: "cashflowbank-e7144.firebasestorage.app",
            messagingSenderId: "424318838821",
            appId: "1:424318838821:web:308d3ac75c87eb99b637cc"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // UI Switcher Helpers
        window.switchTab = function(tab) {
            const loginForm = document.getElementById('login-form');
            const regForm = document.getElementById('register-form');
            const tabLogin = document.getElementById('tab-login');
            const tabReg = document.getElementById('tab-register');
            const errorBox = document.getElementById('auth-error');

            errorBox.classList.add('hidden');

            if(tab === 'login') {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                tabLogin.className = "flex-1 pb-3 text-sm font-semibold text-blue-600 border-b-2 border-blue-600 transition";
                tabReg.className = "flex-1 pb-3 text-sm font-semibold text-slate-400 border-b-2 border-transparent transition";
            } else {
                loginForm.classList.add('hidden');
                regForm.classList.remove('hidden');
                tabReg.className = "flex-1 pb-3 text-sm font-semibold text-blue-600 border-b-2 border-blue-600 transition";
                tabLogin.className = "flex-1 pb-3 text-sm font-semibold text-slate-400 border-b-2 border-transparent transition";
            }
        };

        // Register Action
        window.handleRegister = async function(e) {
            e.preventDefault();
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const errorBox = document.getElementById('auth-error');

            try {
                await createUserWithEmailAndPassword(auth, email, password);
            } catch (error) {
                errorBox.innerText = error.message;
                errorBox.classList.remove('hidden');
            }
        };

        // Login Action
        window.handleLogin = async function(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorBox = document.getElementById('auth-error');

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                errorBox.innerText = error.message;
                errorBox.classList.remove('hidden');
            }
        };

        // Logout Action
        window.handleLogout = async function() {
            await signOut(auth);
        };

        // Transfer Action Simulation
        window.handleTransfer = function(e) {
            e.preventDefault();
            const recipient = document.getElementById('transfer-recipient').value;
            const amount = parseFloat(document.getElementById('transfer-amount').value);
            
            alert(`Successfully transferred $${amount.toFixed(2)} to ${recipient}!`);
            document.getElementById('transfer-recipient').value = '';
            document.getElementById('transfer-amount').value = '';
        };

        // Auth State Observer
        onAuthStateChanged(auth, (user) => {
            const authSection = document.getElementById('auth-section');
            const dashboardSection = document.getElementById('dashboard-section');
            const userDisplayName = document.getElementById('user-display-name');

            if (user) {
                authSection.classList.add('hidden');
                dashboardSection.classList.remove('hidden');
                userDisplayName.innerText = user.email;
            } else {
                authSection.classList.remove('hidden');
                dashboardSection.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
